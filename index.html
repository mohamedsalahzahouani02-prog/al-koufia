<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - Restaurant Al Koufia | مطعم الكوفية</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  
  <!-- Polices Google Fonts : Cinzel, Plus Jakarta Sans, Cairo & Amiri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@600;700;800&family=Cinzel:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-cover-only">

  <main class="book-scene">
    <!-- Le Petit Livre Fermé (Cliquez pour ouvrir vers la page du menu) -->
    <a href="menu.html" class="book-cover-link" aria-label="Ouvrir le menu du Restaurant Al Koufia">
      <div class="book-cover">
        <!-- Cadres dorés -->
        <div class="cover-border-outer"></div>
        <div class="cover-border-inner"></div>

        <!-- Coins en filigrane or -->
        <div class="cover-corner c-tl">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 30V10C2 5.58 5.58 2 10 2H30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M6 30V12C6 8.68 8.68 6 12 6H30" stroke="currentColor" stroke-width="1" opacity="0.6"/>
            <circle cx="10" cy="10" r="2.5" fill="currentColor"/>
          </svg>
        </div>
        <div class="cover-corner c-tr">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 30V10C2 5.58 5.58 2 10 2H30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M6 30V12C6 8.68 8.68 6 12 6H30" stroke="currentColor" stroke-width="1" opacity="0.6"/>
            <circle cx="10" cy="10" r="2.5" fill="currentColor"/>
          </svg>
        </div>
        <div class="cover-corner c-bl">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 30V10C2 5.58 5.58 2 10 2H30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M6 30V12C6 8.68 8.68 6 12 6H30" stroke="currentColor" stroke-width="1" opacity="0.6"/>
            <circle cx="10" cy="10" r="2.5" fill="currentColor"/>
          </svg>
        </div>
        <div class="cover-corner c-br">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 30V10C2 5.58 5.58 2 10 2H30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M6 30V12C6 8.68 8.68 6 12 6H30" stroke="currentColor" stroke-width="1" opacity="0.6"/>
            <circle cx="10" cy="10" r="2.5" fill="currentColor"/>
          </svg>
        </div>

        <!-- Médaillon du Logo officiel -->
        <div class="cover-header-brand">
          <div class="cover-logo-ring">
            <img src="logo.png" alt="Logo Restaurant Al Koufia" class="cover-logo-img">
          </div>
          <h1 class="cover-title-fr">RESTAURANT AL KOUFIA</h1>
          <div class="cover-city-tag">SFAX • صفاقس</div>
          <div class="cover-title-ar" lang="ar" dir="rtl">مطعم الكوفية</div>
        </div>

        <!-- Mot MENU majestueux avec coins dorés -->
        <div class="cover-menu-box">
          <span class="bracket-corner-tl"></span>
          <span class="bracket-corner-br"></span>
          <div class="cover-menu-text">MENU</div>
        </div>

        <!-- Bouton interactif pour ouvrir le livre -->
        <div class="cover-open-action">
          <div class="btn-open-book">
            <span>📖 Ouvrir le Menu</span>
            <span lang="ar" dir="rtl">• افتح القائمة</span>
          </div>
          <div class="cover-tagline-text">Spécialités Tunisiennes & Saveurs Gourmandes</div>
        </div>
      </div>
    </a>
  </main>

</body>
</html>
